# Demo: PodRestartingTooOften
# kubectl apply -f manifests/testing/crashloop-pod.yaml
# kubectl delete -f manifests/testing/crashloop-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  namespace: app
  labels:
    app: crashloop-demo
spec:
  restartPolicy: Always
  containers:
    - name: boom
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
