# Helm values for prometheus-community/kube-prometheus-stack
# Install: helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
#   -n monitoring -f manifests/monitoring/kube-prometheus-values.yaml

fullnameOverride: kps

defaultRules:
  create: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    # AlertmanagerConfig objects are namespace-scoped. The default adds
    # namespace="monitoring" and drops every app, cicd, and node alert.
    alertmanagerConfigMatcherStrategy:
      type: None
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: default

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
          storageClassName: standard

grafana:
  enabled: true
  adminUser: admin
  adminPassword: devops
  persistence:
    enabled: true
    type: pvc
    size: 2Gi
    storageClassName: standard
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
  grafana.ini:
    auth.anonymous:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
