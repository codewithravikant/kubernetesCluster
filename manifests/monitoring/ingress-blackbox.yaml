# Active checks through Ingress: hostname, frontend, and frontend → backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200]
          method: GET
          follow_redirects: true
          preferred_ip_protocol: ip4
      dns_a:
        prober: dns
        timeout: 5s
        dns:
          transport_protocol: udp
          preferred_ip_protocol: ip4
          query_name: chronicles.local
          query_type: A
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.26.0
          args:
            - --config.file=/config/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  type: ClusterIP
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ingress-frontend
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: ingress-nginx
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        check: frontend
        ingress: chronicles
      static:
        - http://chronicles.local/
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ingress-backend
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: ingress-nginx
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        check: frontend_backend
        ingress: chronicles
      static:
        - http://chronicles.local/api/health
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ingress-dns
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: ingress-nginx
spec:
  interval: 30s
  module: dns_a
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        check: dns
        ingress: chronicles
      static:
        - kube-dns.kube-system.svc.cluster.local:53
