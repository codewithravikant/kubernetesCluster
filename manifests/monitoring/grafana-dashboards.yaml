apiVersion: v1
kind: ConfigMap
metadata:
  name: chronicles-cluster-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-performance.json: |
    {
      "title": "Cluster Performance",
      "uid": "chronicles-cluster",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "panels": [
        {
          "type": "timeseries",
          "title": "Node CPU %",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}"}]
        },
        {
          "type": "timeseries",
          "title": "Node Memory %",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{instance}}"}]
        },
        {
          "type": "stat",
          "title": "Pods Running",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 8},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})"}]
        },
        {
          "type": "timeseries",
          "title": "Disk read bytes/s",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "sum by (instance) (rate(node_disk_read_bytes_total[5m]))", "legendFormat": "{{instance}} read"}]
        },
        {
          "type": "timeseries",
          "title": "Disk write bytes/s",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{"expr": "sum by (instance) (rate(node_disk_written_bytes_total[5m]))", "legendFormat": "{{instance}} write"}]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronicles-pod-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pod-container.json: |
    {
      "title": "Pod and Container",
      "uid": "chronicles-pods",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "panels": [
        {
          "type": "timeseries",
          "title": "Container CPU",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}}/{{container}}"}]
        },
        {
          "type": "timeseries",
          "title": "Container Memory",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum by (namespace, pod, container) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\"})", "legendFormat": "{{namespace}}/{{pod}}/{{container}}"}]
        },
        {
          "type": "timeseries",
          "title": "Restart count",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "sum by (namespace, pod) (kube_pod_container_status_restarts_total)", "legendFormat": "{{namespace}}/{{pod}}"}]
        },
        {
          "type": "timeseries",
          "title": "Network receive bytes/s",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "sum by (namespace, pod) (rate(container_network_receive_bytes_total{interface=\"eth0\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}} rx"}]
        },
        {
          "type": "timeseries",
          "title": "Network transmit bytes/s",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [{"expr": "sum by (namespace, pod) (rate(container_network_transmit_bytes_total{interface=\"eth0\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}} tx"}]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronicles-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  application-performance.json: |
    {
      "title": "Application Performance",
      "uid": "chronicles-app",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request duration (p95)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{route}}"}]
        },
        {
          "type": "timeseries",
          "title": "HTTP errors",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum by (route, status_code) (rate(http_request_errors_total[5m]))", "legendFormat": "{{route}} {{status_code}}"}]
        },
        {
          "type": "timeseries",
          "title": "chronicles_diagnostic_polls_total",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [{"expr": "sum by (endpoint) (chronicles_diagnostic_polls_total)", "legendFormat": "{{endpoint}}"}]
        }
      ]
    }
