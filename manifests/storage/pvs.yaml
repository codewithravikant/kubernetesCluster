# Explicit PVs for review demos (RWO + Retain).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-jenkins
  labels:
    type: local
    app: jenkins
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: chronicles-retain
  hostPath:
    path: /mnt/data/jenkins
    type: DirectoryOrCreate
---
