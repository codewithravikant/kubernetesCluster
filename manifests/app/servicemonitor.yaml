apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: app
  labels:
    release: kube-prometheus-stack
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - app
  endpoints:
    - port: http
      path: /metrics/prom
      interval: 15s
