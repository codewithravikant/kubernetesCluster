---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-import-dashboards
  namespace: logging
  labels:
    app: kibana-import-dashboards
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: curlimages/curl:8.10.1
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              KIBANA=http://kibana.logging.svc.cluster.local:5601
              echo "Waiting for Kibana..."
              for i in $(seq 1 90); do
                if curl -sf "$KIBANA/api/status" >/dev/null; then break; fi
                sleep 5
              done
              curl -sf "$KIBANA/api/status" >/dev/null
              echo "Importing Kibana saved objects..."
              code="$(curl -sS -o /tmp/import.out -w "%{http_code}" -X POST \
                "$KIBANA/api/saved_objects/_import?overwrite=true" \
                -H "kbn-xsrf: true" \
                -H "securitytenant: null" \
                --form file=@/dashboards/chronicles-kibana.ndjson)"
              cat /tmp/import.out
              echo
              test "$code" = "200"
              echo "Kibana dashboards imported (cluster / app / pod-container)."
      volumes:
        - name: dashboards
          configMap:
            name: kibana-dashboards
